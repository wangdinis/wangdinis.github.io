<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAZIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000003; overflow: hidden; cursor: none; }
    canvas { display: block; position: fixed; inset: 0; }

    /* ── CURSOR ── */
    #cur {
      position: fixed; z-index: 999; pointer-events: none;
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(200,210,255,0.9);
      transform: translate(-50%,-50%);
      transition: transform 0.1s;
    }
    #cur-ring {
      position: fixed; z-index: 998; pointer-events: none;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(180,200,255,0.15);
      transform: translate(-50%,-50%);
    }

    /* ── UI ── */
    #ui {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }

    #eyebrow {
      font-family: 'EB Garamond', serif;
      font-size: clamp(0.6rem, 1.1vw, 0.8rem);
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: rgba(140,160,220,0.4);
      opacity: 0;
      margin-bottom: 2rem;
    }

    #title {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(5rem, 16vw, 14rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.02em;
      color: rgba(200,210,255,0.07);
      line-height: 0.85;
      text-align: center;
      opacity: 0;
      user-select: none;
    }

    #title-small {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(1.5rem, 4vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,215,255,0.65);
      text-align: center;
      opacity: 0;
      margin-top: -0.5rem;
    }

    #sub {
      font-family: 'EB Garamond', serif;
      font-size: clamp(0.75rem, 1.4vw, 1rem);
      font-style: italic;
      letter-spacing: 0.3em;
      color: rgba(140,160,220,0.35);
      margin-top: 2.5rem;
      opacity: 0;
    }

    /* ── CORNERS ── */
    .corner {
      position: fixed; z-index: 10; pointer-events: none;
      font-family: 'EB Garamond', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(140,160,220,0.2);
      line-height: 1.8;
      opacity: 0;
    }
    #c-tl { top: 2.5rem; left: 3rem; }
    #c-tr { top: 2.5rem; right: 3rem; text-align: right; }
    #c-bl { bottom: 2.5rem; left: 3rem; }
    #c-br { bottom: 2.5rem; right: 3rem; text-align: right; }

    /* ── HORIZON LINE ── */
    #horizon {
      position: fixed; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(to right,
        transparent, rgba(140,160,220,0.12) 20%,
        rgba(140,160,220,0.08) 50%,
        rgba(140,160,220,0.12) 80%, transparent
      );
      z-index: 5; pointer-events: none;
      opacity: 0;
    }

    /* ── SCROLL HINT ── */
    #scroll-hint {
      position: fixed; bottom: 3rem; left: 50%;
      transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.6rem;
      opacity: 0;
    }
    #scroll-hint span {
      font-family: 'EB Garamond', serif;
      font-size: 0.58rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(140,160,220,0.25);
    }
    #scroll-line {
      width: 1px; height: 3rem;
      background: rgba(140,160,220,0.1);
      position: relative; overflow: hidden;
    }
    #scroll-line::after {
      content: '';
      position: absolute; top: -100%; left: 0;
      width: 100%; height: 100%;
      background: rgba(160,180,255,0.5);
      animation: fall 2.5s ease infinite;
    }
    @keyframes fall { 0%{top:-100%} 100%{top:100%} }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="cur"></div>
<div id="cur-ring"></div>

<div id="horizon" style="top:50%"></div>

<div id="ui">
  <div id="eyebrow">espaço profundo · 2024</div>
  <div id="title">Vazio</div>
  <div id="title-small">Vazio</div>
  <div id="sub">onde a luz demora milénios a chegar</div>
</div>

<div class="corner" id="c-tl">VAZIO<br>Espaço Profundo</div>
<div class="corner" id="c-tr">20.000 Partículas<br>Three.js · WebGL</div>
<div class="corner" id="c-bl">Nebulosa · Campo<br>Estelar Sintético</div>
<div class="corner" id="c-br" id="fps-display">60 FPS</div>

<div id="scroll-hint">
  <span>deriva</span>
  <div id="scroll-line"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>

// ════════════════════════════════════════════════════════
// VERTEX SHADER — starfield + nebula
// ════════════════════════════════════════════════════════
const VS_STARS = `
  precision highp float;

  uniform float uTime;
  uniform vec3  uMouse;
  uniform float uWarp;

  attribute float aScale;
  attribute vec3  aColor;
  attribute float aLayer;    // 0=far stars, 1=mid nebula, 2=near bright
  attribute float aTwinkle;
  attribute vec3  aVelocity;

  varying vec3  vColor;
  varying float vAlpha;
  varying float vGlow;

  float hash(float n){ return fract(sin(n*127.1)*43758.5453); }

  void main() {
    vec3 pos = position;

    // ── Drift / parallax by layer ──────────────────
    float drift = uTime * 0.015 * (aLayer + 0.5);
    pos += aVelocity * drift;

    // ── Warp speed effect (scroll) ─────────────────
    if(uWarp > 0.01) {
      pos.z -= uWarp * (aLayer + 1.0) * 8.0;
    }

    // ── Mouse parallax ────────────────────────────
    float parallaxStrength = 0.3 * (aLayer + 0.5);
    pos.x += uMouse.x * parallaxStrength * 0.05;
    pos.y += uMouse.y * parallaxStrength * 0.05;

    // ── Twinkle ───────────────────────────────────
    float twinkle = sin(uTime * aTwinkle * 2.5 + hash(aTwinkle) * 6.28) * 0.5 + 0.5;

    vColor = aColor;
    vAlpha = aLayer < 0.5 ? twinkle * 0.4 :
             aLayer < 1.5 ? 0.15 + twinkle * 0.25 :
                            0.6 + twinkle * 0.4;
    vGlow  = aLayer > 1.5 ? 1.0 : 0.0;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);

    float size = aScale;
    if(aLayer > 1.5) size *= 1.8;
    gl_PointSize = clamp(size * 200.0 / -mv.z, 0.5, aLayer > 1.5 ? 12.0 : 4.0);
    gl_Position  = projectionMatrix * mv;
  }
`;

const FS_STARS = `
  precision highp float;
  varying vec3  vColor;
  varying float vAlpha;
  varying float vGlow;

  void main() {
    vec2  uv   = gl_PointCoord - 0.5;
    float dist = length(uv);
    if(dist > 0.5) discard;

    float alpha;
    if(vGlow > 0.5) {
      // Bright star with diffraction spike hint
      float core = exp(-dist * dist * 80.0);
      float halo = exp(-dist * dist * 8.0) * 0.3;
      // Subtle spike
      float spike = exp(-abs(uv.x) * 40.0) * exp(-abs(uv.y) * 80.0) * 0.15
                  + exp(-abs(uv.y) * 40.0) * exp(-abs(uv.x) * 80.0) * 0.15;
      alpha = (core + halo + spike) * vAlpha;
    } else {
      // Dim star / nebula dust
      alpha = exp(-dist * dist * 12.0) * vAlpha;
    }

    gl_FragColor = vec4(vColor, clamp(alpha, 0.0, 1.0));
  }
`;

// ── Nebula dust shader ────────────────────────────────
const VS_NEBULA = `
  precision highp float;
  uniform float uTime;
  attribute float aScale;
  attribute vec3  aColor;
  attribute float aPhase;
  varying vec3  vColor;
  varying float vAlpha;

  float noise(vec3 p){
    return fract(sin(dot(p,vec3(12.9898,78.233,45.5432)))*43758.5);
  }

  void main() {
    vec3 pos = position;
    // Very slow drift
    float n = noise(pos * 0.1 + vec3(uTime * 0.004));
    pos.x += sin(uTime * 0.012 + aPhase) * 0.8;
    pos.y += cos(uTime * 0.009 + aPhase * 1.3) * 0.6;
    pos.z += sin(uTime * 0.007 + aPhase * 0.7) * 0.5;

    vColor = aColor;
    vAlpha = (0.02 + n * 0.03) * (0.6 + 0.4 * sin(uTime * 0.05 + aPhase));

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = clamp(aScale * 600.0 / -mv.z, 10.0, 120.0);
    gl_Position  = projectionMatrix * mv;
  }
`;

const FS_NEBULA = `
  precision highp float;
  varying vec3  vColor;
  varying float vAlpha;
  void main() {
    vec2  uv = gl_PointCoord - 0.5;
    float d  = length(uv);
    if(d > 0.5) discard;
    float a = exp(-d * d * 3.5) * vAlpha;
    gl_FragColor = vec4(vColor, a);
  }
`;

// ════════════════════════════════════════════════════════
// SETUP
// ════════════════════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x000003, 1);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 0, 30);

const uniforms = {
  uTime:  { value: 0 },
  uMouse: { value: new THREE.Vector3() },
  uWarp:  { value: 0 },
};

// ── Color palette — cold space ────────────────────────
const STAR_COLORS = [
  new THREE.Color(0.85, 0.90, 1.0),   // blue-white
  new THREE.Color(1.0,  1.0,  0.95),  // warm white
  new THREE.Color(0.6,  0.75, 1.0),   // icy blue
  new THREE.Color(0.95, 0.85, 1.0),   // violet-white
  new THREE.Color(0.5,  0.65, 0.95),  // deep blue
];

const NEBULA_COLORS = [
  new THREE.Color(0.10, 0.15, 0.45),  // deep indigo
  new THREE.Color(0.05, 0.10, 0.35),  // deep blue
  new THREE.Color(0.15, 0.08, 0.40),  // purple-blue
  new THREE.Color(0.02, 0.08, 0.25),  // navy
];

// ════════════════════════════════════════════════════════
// NEBULA CLOUDS (large soft particles)
// ════════════════════════════════════════════════════════
function buildNebula(count) {
  const geo    = new THREE.BufferGeometry();
  const pos    = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const scales = new Float32Array(count);
  const phases = new Float32Array(count);

  for(let i = 0; i < count; i++) {
    // Cluster around several nebula cores
    const coreIdx = Math.floor(Math.random() * 4);
    const cores = [
      [0, 2, -15], [-8, -4, -20], [10, 5, -18], [-3, -8, -12]
    ];
    const [cx, cy, cz] = cores[coreIdx];
    const r = Math.random() * 12;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = cx + r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = cy + r * Math.sin(phi) * Math.sin(theta) * 0.6;
    pos[i*3+2] = cz + r * Math.cos(phi) * 0.4;

    const c = NEBULA_COLORS[Math.floor(Math.random() * NEBULA_COLORS.length)];
    colors[i*3]   = c.r + Math.random() * 0.05;
    colors[i*3+1] = c.g + Math.random() * 0.05;
    colors[i*3+2] = c.b + Math.random() * 0.08;

    scales[i] = 0.5 + Math.random() * 1.5;
    phases[i] = Math.random() * Math.PI * 2;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale',   new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: uniforms.uTime },
    vertexShader: VS_NEBULA, fragmentShader: FS_NEBULA,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  });

  return new THREE.Points(geo, mat);
}

const nebula = buildNebula(600);
scene.add(nebula);

// ════════════════════════════════════════════════════════
// STARFIELD
// ════════════════════════════════════════════════════════
function buildStars(count) {
  const geo    = new THREE.BufferGeometry();
  const pos    = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const scales = new Float32Array(count);
  const layers = new Float32Array(count);
  const twinkles = new Float32Array(count);
  const vels   = new Float32Array(count * 3);

  for(let i = 0; i < count; i++) {
    const layer = i < count * 0.6 ? 0 :
                  i < count * 0.9 ? 1 : 2;
    layers[i]   = layer;

    const spread = layer === 0 ? 80 : layer === 1 ? 50 : 30;
    pos[i*3]   = (Math.random() - 0.5) * spread;
    pos[i*3+1] = (Math.random() - 0.5) * spread * 0.6;
    pos[i*3+2] = -Math.random() * 60;

    const c = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
    const brightness = layer === 2 ? 1.0 : 0.4 + Math.random() * 0.5;
    colors[i*3]   = Math.min(c.r * brightness, 1);
    colors[i*3+1] = Math.min(c.g * brightness, 1);
    colors[i*3+2] = Math.min(c.b * brightness, 1);

    scales[i]   = layer === 0 ? 0.3 + Math.random() * 0.3 :
                  layer === 1 ? 0.5 + Math.random() * 0.5 :
                                0.8 + Math.random() * 0.8;

    twinkles[i] = 0.5 + Math.random() * 2.5;

    // Slow drift velocity
    vels[i*3]   = (Math.random() - 0.5) * 0.02;
    vels[i*3+1] = (Math.random() - 0.5) * 0.01;
    vels[i*3+2] = (Math.random() - 0.5) * 0.005;
  }

  geo.setAttribute('position',  new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aScale',    new THREE.BufferAttribute(scales, 1));
  geo.setAttribute('aLayer',    new THREE.BufferAttribute(layers, 1));
  geo.setAttribute('aTwinkle',  new THREE.BufferAttribute(twinkles, 1));
  geo.setAttribute('aVelocity', new THREE.BufferAttribute(vels, 3));

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: VS_STARS, fragmentShader: FS_STARS,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  });

  return new THREE.Points(geo, mat);
}

const stars = buildStars(20000);
scene.add(stars);

// ── Central "black hole" hint — subtle dark ring ──────
const ringGeo = new THREE.TorusGeometry(3, 0.02, 8, 60);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x1a2050, transparent: true, opacity: 0.3
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI * 0.15;
scene.add(ring);

// ════════════════════════════════════════════════════════
// MOUSE + WARP (scroll)
// ════════════════════════════════════════════════════════
const cur     = document.getElementById('cur');
const curRing = document.getElementById('cur-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
let warpTarget = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  const nx = (e.clientX / window.innerWidth)  * 2 - 1;
  const ny = (e.clientY / window.innerHeight) * 2 - 1;
  uniforms.uMouse.value.set(nx * 15, -ny * 10, 0);
});

// Hold click for warp
document.addEventListener('mousedown', () => {
  warpTarget = 1;
  gsap.to(uniforms.uWarp, { value: 1, duration: 0.4, ease: 'power2.in' });
});
document.addEventListener('mouseup', () => {
  warpTarget = 0;
  gsap.to(uniforms.uWarp, { value: 0, duration: 1.5, ease: 'power3.out' });
});

// Scroll also triggers warp
let scrollWarpTimeout;
window.addEventListener('wheel', e => {
  gsap.to(uniforms.uWarp, { value: Math.min(Math.abs(e.deltaY) / 300, 0.8),
    duration: 0.3, ease: 'power2.out' });
  clearTimeout(scrollWarpTimeout);
  scrollWarpTimeout = setTimeout(() => {
    gsap.to(uniforms.uWarp, { value: 0, duration: 2, ease: 'power3.out' });
  }, 300);
});

// ════════════════════════════════════════════════════════
// RESIZE
// ════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ════════════════════════════════════════════════════════
// GSAP INTRO
// ════════════════════════════════════════════════════════
// Horizon line placement
document.getElementById('horizon').style.top = '50%';

const tl = gsap.timeline();
tl.to('#eyebrow',    { opacity: 1, duration: 2, ease: 'power2.out', delay: 0.5 })
  .to('#title',      { opacity: 1, duration: 3, ease: 'power2.out' }, 0.8)
  .to('#title-small',{ opacity: 1, duration: 2, ease: 'power2.out' }, 1.5)
  .to('#sub',        { opacity: 1, duration: 2, ease: 'power2.out' }, 2.5)
  .to('#horizon',    { opacity: 1, duration: 2, ease: 'power2.out' }, 1.5)
  .to('.corner',     { opacity: 1, duration: 1.5, stagger: 0.2 }, 3.0)
  .to('#scroll-hint',{ opacity: 1, duration: 1.5 }, 4.0)
  // Title fades to ghost
  .to('#title-small',{ opacity: 0.04, duration: 4, delay: 3, ease: 'power2.inOut' })
  .to('#sub',        { opacity: 0.08, duration: 3, ease: 'power2.inOut' }, '<');

// ════════════════════════════════════════════════════════
// RENDER LOOP
// ════════════════════════════════════════════════════════
let frame = 0, lastFps = performance.now();
const fpsEl = document.getElementById('c-br');

function animate() {
  requestAnimationFrame(animate);
  frame++;

  const t = performance.now() * 0.001;
  uniforms.uTime.value = t;

  // ── Very slow camera drift — like drifting in space ──
  const warp = uniforms.uWarp.value;
  camera.position.x = Math.sin(t * 0.025) * 2 + uniforms.uMouse.value.x * 0.02;
  camera.position.y = Math.cos(t * 0.018) * 1.2 + uniforms.uMouse.value.y * 0.015;
  camera.position.z = 30 - warp * 8;

  // Subtle tilt
  camera.rotation.z = Math.sin(t * 0.015) * 0.015;
  camera.lookAt(0, 0, 0);

  // ── Ring rotation ─────────────────────────────────
  ring.rotation.y = t * 0.03;

  // ── Cursor ────────────────────────────────────────
  rx += (mx - rx) * 0.08;
  ry += (my - ry) * 0.08;
  cur.style.left     = mx + 'px';
  cur.style.top      = my + 'px';
  curRing.style.left = rx + 'px';
  curRing.style.top  = ry + 'px';

  // Cursor scale on warp
  cur.style.transform = `translate(-50%,-50%) scale(${1 + warp * 3})`;

  // ── FPS ───────────────────────────────────────────
  if(frame % 60 === 0 && fpsEl) {
    const now = performance.now();
    const fps = Math.round(60000 / (now - lastFps));
    lastFps = now;
    fpsEl.textContent = `${fps} FPS\nThree.js r128`;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
